baseURL = 'https://riccioproductions.it/'
languageCode = 'it'
defaultContentLanguage = 'it'
title = 'Riccio Productions'
copyright = "© 2026 Riccio Productions. Tutti i diritti riservati."
theme = 'gallery'
timeout = "600s"

disableKinds = ["taxonomy", "term"]

[params]
  description = "Riccio Productions è un progetto di fotografia e videomaking, nato dalla voglia di trasformare una passione in qualcosa di concreto."
  defaultTheme = "dark"
  ogImage = "images/og-default.jpg"

[params.socialIcons]
  instagram = "https://www.instagram.com/riccio.productions"
  email = "mailto:riccio.prod@gmail.com"

# Gli originali non vengono pubblicati: solo le versioni ridimensionate.
[[cascade]]
  [cascade.build]
    publishResources = false

[menu]
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "Chi sono"
    url = "/about/"
    weight = 20
